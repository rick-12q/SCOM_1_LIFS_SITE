<form id="form-trabalho" novalidate>
  <div class="form-field">
    <label for="titulo">Título do trabalho</label>
    <input type="text" id="titulo" required>
  </div>
  <div class="form-field">
    <label for="autores">Autores</label>
    <input type="text" id="autores" required placeholder="Sobrenome, N.; Sobrenome, N.">
  </div>
  <div class="form-field">
    <label for="ano">Ano</label>
    <input type="number" id="ano" min="2000" max="2026" required>
  </div>
  <div class="form-field">
    <label for="tipo">Tipo</label>
    <select id="tipo" required>
      <option value="artigo">Artigo</option>
      <option value="anais">Anais</option>
      <option value="congresso">Congresso</option>
      <option value="premio">Prêmio</option>
    </select>
  </div>
  <div class="form-field">
    <label for="pdf">Arquivo PDF</label>
    <input type="file" id="pdf" accept="application/pdf">
  </div>
  <button type="submit" class="btn btn-primary">Salvar trabalho</button>
</form>
